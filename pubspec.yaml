name: pro_draft
description: "ProDraft - Fantasy Basketball Card Game"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  vibration: ^2.0.0
  shared_preferences: ^2.3.5
  visibility_detector: ^0.4.0+2
  flutter_riverpod: ^3.3.1
  o3d: ^3.1.3
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
